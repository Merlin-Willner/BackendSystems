quarkus.hibernate-orm.log.sql=false
quarkus.http.port=8080
quarkus.log.console.level=INFO
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./target/h2/mealplanner;AUTO_SERVER=TRUE;FILE_LOCK=FILE;
quarkus.datasource.username=sa
quarkus.datasource.password=sa

app.jwt.secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
app.jwt.expiration-minutes=30
